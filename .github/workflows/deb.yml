name: deb

on:
  push:
    branches: [main, dev]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      # git must be present before checkout, otherwise checkout downloads a tarball
      # without .git and `make deb` (git ls-files, git clone) fails.
      - name: Install build dependencies
        run: |
          echo 'deb http://deb.debian.org/debian trixie-backports main' > /etc/apt/sources.list.d/backports.list
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git build-essential debhelper lintian
          apt-get install -y --no-install-recommends -t \
            trixie-backports golang-go

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check tag matches changelog
        if: github.ref_type == 'tag'
        run: |
          version="$(dpkg-parsechangelog -S Version)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match debian/changelog version $version"
            exit 1
          fi

      - name: Build package
        run: make deb

      - name: Lintian
        run: lintian --info --fail-on error dist/*.changes

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb
          if-no-files-found: error
          path: |
            dist/*.deb
            dist/*.dsc
            dist/*.tar.*
            dist/*.buildinfo
            dist/*.changes

  # Waits for manual approval: Settings → Environments → release → Required reviewers.
  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb
          path: dist

      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.deb

      # --verify-tag: fail instead of creating the tag on the default branch if it was deleted.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --verify-tag
          --title "$GITHUB_REF_NAME" --generate-notes
